[package]
name = "aura"
version = "0.1.0"
edition = "2021"
description = "Aura for Windows — floating pill (Dynamic Island) port of Aura (Mac), native Rust + Win32 + Direct2D"
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Foundation_Numerics",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", # Phase 3b fix: STGMEDIUM + IDataObject_Impl live behind this feature
    "Win32_System_Ole", # Phase 3b: DoDragDrop, IDataObject, IDropSource, OleInitialize
    "Win32_System_Memory", # Phase 3b: GlobalAlloc for CF_HDROP
    "Win32_System_SystemServices", # MODIFIERKEYS_FLAGS (IDropSource QueryContinueDrag param type)
    "Win32_Security",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Web_Http",
] }
windows-core = "0.58" # Phase 3b fix: #[implement] expands to windows_core paths; without a direct dep the macro fails with E0433
chrono = "0.4"
serde_json = "1.0"

[profile.release]
# Keep debug info in release builds during Phase 0-4 so crash stacks
# name source lines (helps pinpoint issues from user-pasted stacks).
# Strip in Phase 5 packaging if size matters.
debug = true
